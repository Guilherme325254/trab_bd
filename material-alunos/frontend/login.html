<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar — Minha Loja</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topo">
  <div class="topo-conteudo">
    <a href="index.html" class="logo" id="logo-loja">Loja</a>
    <nav class="menu">
      <a href="index.html">Catálogo</a>
      <a href="painel.html">Painel da Loja</a>
      <a href="carrinho.html" class="carrinho-link">Carrinho <span class="carrinho-badge" id="carrinho-badge">0</span></a>
      <a href="conta.html" id="link-conta">Entrar</a>
    </nav>
  </div>
</header>

<main style="max-width:400px">
  <h1>Entrar</h1>
  <div class="card">
    <div id="mensagens"></div>
    <form id="form-login">
      <div class="campo">
        <label for="email">E-mail</label>
        <input type="email" id="email" required>
      </div>
      <div class="campo">
        <label for="senha">Senha</label>
        <input type="password" id="senha" required>
      </div>
      <button type="submit" class="botao" style="width:100%">Entrar</button>
    </form>
    <p style="margin-top:14px">Ainda não tem conta? <a href="cadastro.html">Cadastre-se</a></p>
  </div>
</main>

<footer class="rodape">Trabalho de Banco de Dados — Loja Virtual</footer>

<script src="js/config.js"></script>
<script src="js/util.js"></script>
<script src="js/api.js"></script>
<script src="js/login.js"></script>
</body>
</html>
